name: Egyptian AI Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Egyptian story
        run: python story_generator.py

      - name: Save generated story
        uses: actions/upload-artifact@v4
        with:
          name: egyptian-short-story
          path: output/story.txt
          retention-days: 30
