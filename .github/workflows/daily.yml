name: Egyptian AI Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate story
        run: python story_generator.py

      - name: Generate video
        run: python video_generator.py

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python youtube_uploader.py

      - name: Save video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short
          path: output/short.mp4
          if-no-files-found: ignore
          retention-days: 7
