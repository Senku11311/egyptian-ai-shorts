name: Egyptian AI Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow edge-tts

      - name: Generate story
        run: python story_generator.py

      - name: Generate video
        run: python video_generator.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: daily-short
          path: output/short.mp4
          retention-days: 7
